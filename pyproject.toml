[project]
name = "kamp-injection-molding"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "nbconvert>=7.0", "jinja2>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
